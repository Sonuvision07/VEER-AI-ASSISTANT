name: VEER Windows Agent CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Windows agent
        run: python -m py_compile windows/veer_pc_agent.py windows/veer_cloud_worker.py windows/veer_cloud_store.py windows/veer_cloud_service.py
      - name: Run security and API tests
        run: python -m unittest discover -s windows -p "test_*.py" -v
